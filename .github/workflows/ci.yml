name: CI + Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-test:
    name: 核心转换 / Schema / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
      - run: node tests/smoke.js
      - run: node tests/fixtures.js
      - run: node tests/check.js
      - run: node tests/features.js
      - run: node tests/schema.js
      - name: Build dist + standalone
        run: node build.mjs
      - name: dist 与源码一致性
        run: node tests/dist.js
      - name: 上传唯一发布产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  browser-test:
    name: 浏览器 E2E / 布局
    runs-on: ubuntu-latest
    needs: core-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 下载 core-test 已构建的 dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: node tests/layout.js
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: node tests/e2e.js
        env:
          CHROME_BIN: /usr/bin/google-chrome

  singbox-check-modern:
    name: sing-box check (${{ matrix.singbox }} · 1.12–1.13)
    runs-on: ubuntu-latest
    needs: core-test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        singbox: ['1.12.15', '1.13.18']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/check.js --emit .ci-configs
      - name: 安装 sing-box ${{ matrix.singbox }}
        run: |
          set -euo pipefail
          version='${{ matrix.singbox }}'
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          install -m 0755 "sing-box-${version}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version
      - name: 官方 sing-box check
        run: |
          set -euo pipefail
          fail=0
          for file in .ci-configs/modern13/*.json; do
            if sing-box check -c "$file"; then echo "  ok   $file"; else echo "  FAIL $file"; fail=1; fi
          done
          test "$fail" -eq 0

  singbox-check-latest:
    name: sing-box check + 官方 Schema (1.14.0-beta.14)
    runs-on: ubuntu-latest
    needs: core-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/check.js --emit .ci-configs
      - name: 安装 sing-box 1.14.0-beta.14
        run: |
          set -euo pipefail
          version='1.14.0-beta.14'
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          install -m 0755 "sing-box-${version}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version
      - name: 生成官方 JSON Schema
        run: sing-box schema -o .ci-schema.json
      - name: 官方 Schema 校验
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
          python tests/official_schema.py .ci-schema.json .ci-configs/latest14
      - name: 官方 sing-box check
        run: |
          set -euo pipefail
          fail=0
          for file in .ci-configs/latest14/*.json; do
            if sing-box check -c "$file"; then echo "  ok   $file"; else echo "  FAIL $file"; fail=1; fi
          done
          test "$fail" -eq 0

  singbox-check-legacy:
    name: sing-box check (1.11.15 · legacy)
    runs-on: ubuntu-latest
    needs: core-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/check.js --emit .ci-configs
      - name: 安装 sing-box 1.11.15
        run: |
          set -euo pipefail
          version='1.11.15'
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          install -m 0755 "sing-box-${version}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version
      - name: 官方 sing-box check
        run: |
          set -euo pipefail
          fail=0
          for file in .ci-configs/legacy11/*.json; do
            if sing-box check -c "$file"; then echo "  ok   $file"; else echo "  FAIL $file"; fail=1; fi
          done
          test "$fail" -eq 0

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [core-test, browser-test, singbox-check-modern, singbox-check-latest, singbox-check-legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: 下载已通过测试的唯一构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
